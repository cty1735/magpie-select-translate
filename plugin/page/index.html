<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>划词翻译</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 20px 22px;
    font: 14px/1.7 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0 0 8px; font-size: 12px; opacity: .7; }
  code { font-family: Consolas, monospace; }
</style>
</head>
<body>
  <h1>划词翻译</h1>
  <p id="said">正在打开设置页…</p>
  <p>如果一直没跳转，说明 helper 没起来：设置页由 helper 提供，模型列表也要从本地网关读。
     跑一次 <code>scripts\install.ps1</code>，或重开一次 magpie。</p>

  <script>
    // 带路页：页面在沙箱里（connect-src 'none'），除了解释跳转什么网都联不上，
    // 所以不能先探活，直接跳到 helper 自己的设置页——那边能读网关模型、能写设置。
    (async () => {
      const fallback = 3477
      let port = fallback
      try {
        const opts = await window.magpie?.options?.get?.()
        if (opts && Number(opts.port) > 0) port = Number(opts.port)
      } catch { /* 没有宿主就用默认端口 */ }
      const target = "http://127.0.0.1:" + port + "/"
      // WebKit/WebView2 跳不过去时不报错，页面会停在“正在打开”。5 秒后还没被替换就提示一下。
      setTimeout(() => {
        const said = document.getElementById("said")
        if (said) said.textContent = "没能连上 helper（127.0.0.1:" + port + "）"
      }, 5000)
      location.replace(target)
    })()
  </script>
</body>
</html>
