<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>划词翻译</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 20px 22px;
    font: 14px/1.7 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0 0 8px; font-size: 12px; opacity: .7; }
  code { font-family: Consolas, monospace; }
</style>
<!-- magpie 的页面桥：页面必须让它报到（hello），10 秒没报到 magpie 就当页面没响应 -->
<script src="_magpie/bridge.js"></script>
</head>
<body>
  <h1>划词翻译</h1>
  <p id="said">正在打开设置页…</p>
  <p>设置页由 helper 提供（模型列表要从本地网关读）。如果一直没跳转，说明 helper 没起来：
    跑一次 <code>scripts\install.ps1</code>，或重开一次 magpie。</p>

  <script>
    // 带路页：页面在沙箱里（connect-src 'none'），除了解释跳转什么网都联不上，
    // 所以不能先探活，直接跳到 helper 自己的设置页——那边能读网关模型、能写设置。
    (async () => {
      // 碰 magpie.ready 才会给 magpie 发 hello（bridge.js 里就是 call("hello")），
      // 少了这一步 magpie 10 秒后显示“此页面已停止工作 / 页面没有响应”。
      // 只是别被它拖住跳转：magpie 没答就自己走。
      await Promise.race([window.magpie?.ready, new Promise((r) => setTimeout(r, 1500))])

      let port = 3477
      try {
        const opts = await window.magpie?.options?.get?.()
        if (opts && Number(opts.port) > 0) port = Number(opts.port)
      } catch { /* 没有宿主就用默认端口 */ }

      // WebKit/WebView2 跳不过去时不报错，页面会一直停在“正在打开”：5 秒后提示一下。
      setTimeout(() => {
        const said = document.getElementById("said")
        if (said) said.textContent = "没能连上 helper（127.0.0.1:" + port + "）"
      }, 5000)

      location.replace("http://127.0.0.1:" + port + "/")
    })()
  </script>
</body>
</html>
